<!doctype html>
<meta charset="utf-8">
<title>General</title>
<link rel="stylesheet" href="settings.css">
<nav id="tabs" role="tablist">
  <button type="button" role="tab" data-pane="general">General</button>
  <button type="button" role="tab" data-pane="notifications">Notifications</button>
  <button type="button" role="tab" data-pane="accounts">Accounts</button>
  <button type="button" role="tab" data-pane="about">About</button>
</nav>
<p id="load-error" role="alert" hidden></p>

<section id="pane-general" data-title="General" hidden>
  <div class="field">
    <label>Theme
      <select id="theme">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
    <p class="error" role="alert" hidden></p>
  </div>
  <div class="field">
    <label>Zoom
      <input id="zoom" type="range" min="0.25" max="3" step="0.05">
      <output id="zoom-value"></output>
    </label>
    <div class="presets">
      <button type="button" data-zoom="0.9">90%</button>
      <button type="button" data-zoom="1">100%</button>
      <button type="button" data-zoom="1.1">110%</button>
      <button type="button" data-zoom="1.25">125%</button>
    </div>
    <p class="error" role="alert" hidden></p>
  </div>
  <div class="field">
    <label><input id="autostart" type="checkbox"> Start at login</label>
    <p class="error" role="alert" hidden></p>
  </div>
  <div class="field">
    <label><input id="start-minimized" type="checkbox"> Start minimized</label>
    <p class="error" role="alert" hidden></p>
  </div>
  <div class="field">
    <label><input id="close-to-tray" type="checkbox"> Close to tray</label>
    <p class="error" role="alert" hidden></p>
  </div>
  <div class="field" id="clear-cache-row">
    <label><input id="clear-cache" type="checkbox"> Clear cache on exit</label>
    <p class="error" role="alert" hidden></p>
  </div>
</section>

<section id="pane-notifications" data-title="Notifications" hidden>
  <div class="field">
    <label><input id="notifications" type="checkbox"> Message notifications</label>
    <p class="error" role="alert" hidden></p>
  </div>
  <div class="row">
    <span>macOS notifications: <span id="permission-status"></span></span>
    <button id="permission-button" type="button" hidden></button>
  </div>
  <div class="field">
    <label><input id="show-sender" type="checkbox"> Show sender</label>
    <p class="error" role="alert" hidden></p>
  </div>
  <div class="field">
    <label><input id="sound-enabled" type="checkbox"> Sound</label>
    <p class="error" role="alert" hidden></p>
  </div>
  <div class="field">
    <label>Sound file (empty for the default)
      <input id="sound-path" type="text">
    </label>
    <p class="error" role="alert" hidden></p>
  </div>
  <p>Snooze: <span id="snooze-status"></span></p>
</section>

<section id="pane-accounts" data-title="Accounts" hidden>
  <ul id="accounts"></ul>
  <p class="error" role="alert" hidden></p>
</section>

<section id="pane-about" data-title="About" hidden>
  <h1 id="app-name"></h1>
  <p>Version <span id="app-version"></span></p>
  <p>Not affiliated with or endorsed by WhatsApp or Meta.</p>
</section>
<script src="settings.js"></script>
