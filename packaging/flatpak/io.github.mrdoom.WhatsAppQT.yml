app-id: io.github.mrdoom.WhatsAppQT
runtime: org.kde.Platform
# Qt6 runtime: the app moved from qmetaobject (Qt5) to cxx-qt (Qt6).
# UNVERIFIED against Flathub: confirm this runtime-version still exists and that the
# rust-stable extension branch below matches its freedesktop base before releasing.
runtime-version: '6.7'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable//23.08
command: WhatsApp-QT

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  - --filesystem=xdg-download
  - --env=WHATSAPPQT_DATA_DIR=/app/share/whatsapp-qt

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/WhatsApp-QT/cargo
    RUST_BACKTRACE: '1'

modules:
  - name: WhatsApp-QT
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo --offline build --release
      - install -Dm755 target/release/WhatsApp-QT /app/bin/WhatsApp-QT
      # QML and runtime data
      - cp -r qml /app/share/whatsapp-qt/qml
      - cp -r resources /app/share/whatsapp-qt/resources
      # Icons
      - install -Dm644 resources/icons/tray.png
          /app/share/icons/hicolor/512x512/apps/io.github.mrdoom.WhatsAppQT.png
      # Desktop entry and AppStream metadata
      - install -Dm644 packaging/WhatsApp-QT.desktop
          /app/share/applications/io.github.mrdoom.WhatsAppQT.desktop
      - install -Dm644 packaging/flatpak/io.github.mrdoom.WhatsAppQT.metainfo.xml
          /app/share/metainfo/io.github.mrdoom.WhatsAppQT.metainfo.xml
    sources:
      - type: dir
        path: ../..
      # Generated by: python3 packaging/flatpak/flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - cargo-sources.json
