[package]
name = "WhatsApp-QT"
version = "0.1.0"
edition = "2024"
authors = ["MJ <mj@LocalHost.Com>"]
description = "WhatsApp and telegram messaging in rust using QT"
license = "MIT"
repository = "https://github.com/mr.mydoom/whatsapp-qt"
homepage = "https://mr.mydoom.github.com"
documentation = "https://github.com/mr.mydoom/whatsapp-qt"
keywords = ["rust", "qt", "whatsapp"]
categories = ["gui-utilities", "messaging-tools"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "4.0"
# Qt6 bindings. cxx-qt replaced qmetaobject (which is Qt5-only) so that the Qt6-only
# QML APIs the frontend already uses (`import QtCore`, versionless QtQuick.Dialogs)
# actually resolve.
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["qt_full"] }
rand = "0.9.2"
tokio = { version = "1.46.1", features = ["full"] }
chrono = "0.4.41"
futures = "0.3.31"
blocking = "1.6.2"
notify-rust = "4.0"
log = "0.4"
env_logger = "0.11"

# Windows-only: winrt-notification depends on the `windows` crate, which does not
# build on macOS/Linux. Keep it out of non-Windows builds.
[target.'cfg(windows)'.dependencies]
winrt-notification = "0.5"


[build-dependencies]
# Generates the C++ side of the cxx-qt bridge, compiles the QML module into the
# binary's Qt resources, and links the Qt libraries.
cxx-qt-build = { version = "0.7", features = ["link_qt_object_files"] }

[features]
default = []
embedded-resources = []


[profile.release]
opt-level = "z"
lto = true
codegen-units = 256
strip = "debuginfo"
#debuginfo = 0
panic = "abort"

#[target.x86_64-pc-windows-gnu]
#linker = "x86_64-w64-mingw32-gcc"
#[target.aarch64-unknown-linux-gnu]
#linker = "aarch64-unknown-linux-gnu-gcc"
#[target.x86_64-unknown-linux-musl]
#linker = "x86_64-linux-musl-gcc"
