[package]
name = "WhatsApp-QT"
version = "0.1.0"
edition = "2021"
authors = ["MJ <mj@LocalHost.Com>"]
description = "WhatsApp and telegram messaging in rust using Tauri"
license = "MIT"
repository = "https://github.com/mr.mydoom/whatsapp-qt"
homepage = "https://mr.mydoom.github.com"
documentation = "https://github.com/mr.mydoom/whatsapp-qt"
keywords = ["rust", "qt", "whatsapp"]
categories = ["gui-utilities", "messaging-tools"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "4.0"
# Exact pin: the `unstable` child-webview API can change in a minor release.
tauri = { version = "=2.12.4", features = ["unstable"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.9.2"
tokio = { version = "1.46.1", features = ["full"] }
chrono = "0.4.41"
futures = "0.3.31"
blocking = "1.6.2"
notify-rust = "4.0"
log = "0.4"
env_logger = "0.11"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
url = "2"

# Windows-only: winrt-notification depends on the `windows` crate, which does not
# build on macOS/Linux. Keep it out of non-Windows builds.
[target.'cfg(windows)'.dependencies]
winrt-notification = "0.5"


[build-dependencies]
tauri-build = "=2.7.3"

[features]
default = []
embedded-resources = []


[profile.release]
opt-level = "z"
lto = true
codegen-units = 256
strip = "debuginfo"
#debuginfo = 0
panic = "abort"

#[target.x86_64-pc-windows-gnu]
#linker = "x86_64-w64-mingw32-gcc"
#[target.aarch64-unknown-linux-gnu]
#linker = "aarch64-unknown-linux-gnu-gcc"
#[target.x86_64-unknown-linux-musl]
#linker = "x86_64-linux-musl-gcc"
