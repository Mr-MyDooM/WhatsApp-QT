[package]
name = "pairline"
version = "0.1.0"
edition = "2021"
authors = ["MJ <mj@LocalHost.Com>"]
description = "WhatsApp and telegram messaging in rust using Tauri"
license = "MIT"
repository = "https://github.com/Mr-MyDooM/WhatsApp-QT"
homepage = "https://mr.mydoom.github.com"
documentation = "https://github.com/mr.mydoom/whatsapp-qt"
keywords = ["rust", "tauri", "whatsapp"]
categories = ["gui-utilities", "messaging-tools"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "4.0"
# Exact pin: the `unstable` child-webview API can change in a minor release.
tauri = { version = "=2.12.4", features = ["unstable", "tray-icon", "macos-private-api"] }
tauri-plugin-window-state = "2"
uuid = { version = "1", features = ["v4"] }
# Decodes the profile picture data URL. Already in Cargo.lock (0.22.1) through Tauri: no new crate.
base64 = "0.22"
notify-rust = "4.0"
log = "0.4"
env_logger = "0.11"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
url = "2"
tauri-plugin-autostart = "2.6.0"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[features]
# Serve the built frontend/dist instead of build.devUrl. `cargo tauri build` turns it on.
custom-protocol = ["tauri/custom-protocol"]

# macOS-only: the cache clear on quit calls WKWebsiteDataStore directly, because
# Tauri only offers clear_all_browsing_data, which also removes logins. Versions match
# the ones wry already pulls in, so Cargo.lock gains no new crate.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-user-notifications = "0.3.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSDate", "NSDictionary", "NSError", "NSObject", "NSSet", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKWebsiteDataRecord"] }


[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 256
strip = "debuginfo"
#debuginfo = 0
panic = "abort"

#[target.x86_64-pc-windows-gnu]
#linker = "x86_64-w64-mingw32-gcc"
#[target.aarch64-unknown-linux-gnu]
#linker = "aarch64-unknown-linux-gnu-gcc"
#[target.x86_64-unknown-linux-musl]
#linker = "x86_64-linux-musl-gcc"
